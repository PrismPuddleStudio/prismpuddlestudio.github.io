<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism Puddle Studios</title>
  <meta name="description" content="Prism Puddle Studios makes Number Garden - Color By Number, a relaxing color-by-number app.">
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      color: #3c3452;
      background:
        radial-gradient(1100px 560px at 0% -8%, #ffe8f4 0%, transparent 55%),
        radial-gradient(900px 480px at 100% 0%, #e5f3ff 0%, transparent 50%),
        radial-gradient(780px 460px at 85% 100%, #e7fff3 0%, transparent 50%),
        radial-gradient(680px 400px at 8% 100%, #fff4dc 0%, transparent 46%),
        #f6f3fb;
      line-height: 1.6;
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: 12vh 1.15rem 3.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 1.4rem;
      box-shadow: 0 18px 50px rgba(120, 100, 160, 0.12);
      padding: 1.75rem 1.4rem 1.9rem;
    }
    .card::before {
      content: "";
      display: block;
      height: 6px;
      margin: -1.75rem -1.4rem 1.35rem;
      background: linear-gradient(90deg, #f7b5d2, #f3c98b, #b7e3c2, #a9d4f5, #c9b6f2);
    }
    .moon {
      margin: 0 0 0.35rem;
      font-size: 1.55rem;
      letter-spacing: 0.12em;
      color: #c9a6e0;
    }
    h1 {
      font-size: clamp(1.85rem, 5vw, 2.35rem);
      line-height: 1.15;
      font-weight: 600;
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    p { margin: 0.7rem 0; font-size: 1.08rem; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.35rem;
    }
    a {
      color: #6b4c9a;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.95rem;
      text-decoration: none;
      background: #fff;
      border: 1px solid #eadff5;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
    }
    a:hover { color: #2f7d86; border-color: #c9b6e8; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <p class="moon" aria-hidden="true">☾</p>
      <h1>Prism Puddle Studios</h1>
      <p>Makers of Number Garden - Color By Number, a relaxing color-by-number app.</p>
      <nav>
        <a href="/privacy/">Privacy Policy</a>
        <a href="mailto:numbergarden@protonmail.com">numbergarden@protonmail.com</a>
      </nav>
    </div>
  </main>
</body>
</html>
